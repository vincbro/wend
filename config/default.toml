# wend's config. Save it as config.toml in wend's config folder (`~/.config/wend`), for
# example with `wend --default-config > ~/.config/wend/config.toml`. Without a config file
# wend uses these values, and a setting the file leaves out keeps the value shown here.

# The theme to draw with: a built-in one such as `default`, or the name of a file in the
# themes folder next to this one. `wend --theme <name>` prints a built-in one to copy from.
theme = "default"

# Keys. A combo is the keys typed in a row: `gs`, `<C-x>` for control, `<A-x>` for alt,
# `<esc>` `<enter>` `<tab>` `<backspace>` `<space>` for the named keys, `<lt>` for `<`
# and `<leader>` for the leader key. An action is a name, or a list of names that run
# in order. Bind a combo to `[]` to remove it. A combo can't also be the start of a
# longer one, so unbind `gs` and `ge` before binding `g`.
[keys]
# The key `<leader>` stands for in a combo.
leader = "<space>"

# Keys in normal mode.
[keys.normal]
H = "line_start" # start of the line
J = "page_down" # last row on screen
K = "page_up" # first row on screen
L = "line_end" # end of the line
b = "previous_word" # select the previous word
d = "delete_selection" # delete the selection
ge = "file_end" # end of the file
gs = "file_start" # start of the file
h = "left" # one grapheme left
i = "insert_mode" # insert mode
j = "down" # one row down
k = "up" # one row up
l = "right" # one grapheme right
n = "next_match" # select the next match of the search
o = ["open_line", "insert_mode"] # open a line below, then insert mode
p = "previous_match" # select the previous match of the search
u = "revert" # revert to the last save
v = "select_mode" # select mode
w = "next_word" # select the next word
x = "select_row" # select the screen row the cursor is on
"/" = "find" # search the text
"<esc>" = [
  "collapse_selection",
  "normal_mode",
] # drop the selection down to the cursor, then normal mode

# Keys in select mode, where motions extend the selection.
[keys.select]
H = "line_start" # start of the line
J = "page_down" # last row on screen
K = "page_up" # first row on screen
L = "line_end" # end of the line
b = "previous_word" # select the previous word
d = "delete_selection" # delete the selection
ge = "file_end" # end of the file
gs = "file_start" # start of the file
h = "left" # one grapheme left
i = "insert_mode" # insert mode
j = "down" # one row down
k = "up" # one row up
l = "right" # one grapheme right
n = "next_match" # select the next match of the search
o = ["open_line", "insert_mode"] # open a line below, then insert mode
p = "previous_match" # select the previous match of the search
u = "revert" # revert to the last save
v = "normal_mode" # normal mode
w = "next_word" # select the next word
x = "select_row" # select the screen row the cursor is on
"/" = "find" # search the text
"<esc>" = [
  "collapse_selection",
  "normal_mode",
] # drop the selection down to the cursor, then normal mode

# Keys in insert mode. `<char>` is any key that types a character, and a key bound
# by itself goes before it.
[keys.insert]
"<char>" = "insert_char"     # the character of the key
"<enter>" = "insert_newline" # a line break
"<esc>" = "normal_mode"      # normal mode
"<backspace>" = "delete"     # delete the grapheme before the cursor
"<tab>" = "insert_tab"       # a tab

# What the scratch binds besides the shared keys above, which every text box answers to. The
# scratch is the editing surface: its keys are about the document and the editor.
[keys.scratch.normal]
":" = "open_command_line"         # type a command
"<leader>e" = "open_test_overlay" # two windows side by side
"<leader>f" = "open_search"       # search for a file
"<leader>/" = "open_search text"  # search for text in the files

[keys.scratch.select]
":" = "open_command_line" # type a command

# What the test overlay binds over the shared keys. It must keep a binding that closes it.
[keys.test.normal]
"<esc>" = "close_overlay" # close the overlay

# What the command line binds over the shared keys. It must keep a binding that closes it.
[keys.command.normal]
"<esc>" = "close_overlay" # close the command line
"<enter>" = "run_command" # run the command typed

[keys.command.select]
"<enter>" = "run_command" # run the command typed

[keys.command.insert]
"<enter>" = "run_command" # run the command typed

# What the search binds over the shared keys, for the box the query is typed in and the one the
# results are in. It must keep a binding that closes it.
[keys.search.normal]
"<esc>" = "close_overlay" # close the search
"<enter>" = "pick_result" # open the file on the line picked

[keys.search.select]
"<enter>" = "pick_result" # open the file on the line picked

[keys.search.insert]
"<enter>" = "pick_result" # open the file on the line picked

# What the prompt that searches a text binds over the shared keys. It must keep a binding that
# closes it, which puts the selection back where it was.
[keys.find.normal]
"<esc>" = "close_find"     # close the search
"<enter>" = "confirm_find" # keep the match selected

[keys.find.select]
"<enter>" = "confirm_find" # keep the match selected

[keys.find.insert]
"<esc>" = "close_find"     # close the search
"<enter>" = "confirm_find" # keep the match selected

[search]
# What finds the results the search lists, run by `sh -c` for each query. Each prints one result
# per line, and gets the query in the environment variable `WEND_QUERY`, which is never written
# into the command. Both need `rg` installed. To match fuzzily swap the second `rg` of `files`
# for a matcher, such as `fzf --filter "$WEND_QUERY"`.
# The files to list, which are matched as plain text, in any case until the query has a capital.
# A result is the path `Enter` opens.
files = 'rg --files | rg --fixed-strings --smart-case -e "$WEND_QUERY"'
# The text in the files, with no results for an empty query. A result is `path:line:text`, and
# `Enter` opens the file on its line.
text = '[ -n "$WEND_QUERY" ] && rg --with-filename --line-number --no-heading --color never --smart-case --fixed-strings -e "$WEND_QUERY"'


[scroll]
# The rows kept between the cursor and the edge of the view.
margin = 10


[text]
# The columns between tab stops, at least 1.
tab_width = 4


[line_numbers]
# The fewest digits the numbers make room for, so the text only moves past that many.
min_digits = 3
# The blank columns between the numbers and the text.
padding = 1
