[package]
name = "wend-core"
description = "The core of the wend text editor: buffers, editing and state, with no terminal attached."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["editor", "text-editor", "rope", "modal"]
categories = ["text-editors"]

[lib]
# Skip libtest's bench harness, the benches use criterion.
bench = false

[dependencies]
crop.workspace = true
thiserror.workspace = true
unicode-width.workspace = true

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

# A headless editing session timed over growing files: `just bench`.
[[bench]]
name = "session"
harness = false
